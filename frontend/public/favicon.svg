<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84E6" />
      <stop offset="50%" stop-color="#0073D1" />
      <stop offset="100%" stop-color="#1B2E4B" />
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9DE01A" />
      <stop offset="100%" stop-color="#7FB000" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Circle with specular rim -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" filter="url(#shadow)" stroke="#4DA9FF" stroke-width="1.5" />
  
  <!-- Outer Signal Wave -->
  <path d="M 14 36 A 18 18 0 0 1 50 36" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  
  <!-- Mid Signal Wave -->
  <path d="M 20 40 A 12 12 0 0 1 44 40" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9" />

  <!-- Inner Signal Wave (Lime Accent) -->
  <path d="M 26 44 A 6 6 0 0 1 38 44" fill="none" stroke="url(#wave)" stroke-width="3" stroke-linecap="round" />

  <!-- Center Pulse Dot -->
  <circle cx="32" cy="46" r="3.5" fill="#FFFFFF" />
  <circle cx="32" cy="46" r="2" fill="url(#wave)" />

  <!-- Vertical Antenna Pillar -->
  <line x1="32" y1="46" x2="32" y2="18" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  
  <!-- Beacon Emitter Bulb -->
  <circle cx="32" cy="18" r="4.5" fill="url(#wave)" stroke="#FFFFFF" stroke-width="1.5" />
</svg>
